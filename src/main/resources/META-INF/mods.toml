# Forge and NeoForge 1.20.1 run this mod through Sinytra Connector, the same way Origins itself does.
# This file only tells Forge what is needed; the mod is loaded from fabric.mod.json.
modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/KiaOnigiri/WindyOrigins/issues"

[properties]
"connector:placeholder"=true

[[mods]]
modId="windyorigins"
version="${version}"
displayName="Windy Origins"
displayURL="https://github.com/KiaOnigiri/WindyOrigins"
authors="WindyKindy49"
description='''
Nine new origins for the Origins mod: the Mirrored, the Stalker, the Frostborn, the Luminian, the Folded, the Sanguine, the Revenant, the Host with her companion Volta, and the Dreamwalker.
'''

[[dependencies.windyorigins]]
modId="connectormod"
mandatory=true
versionRange="[1.0.0-beta.46,)"
ordering="NONE"
side="BOTH"

[[dependencies.windyorigins]]
modId="origins"
mandatory=true
versionRange="[1.10.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.windyorigins]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"
