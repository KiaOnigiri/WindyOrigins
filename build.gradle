plugins {
    // Loom 1.11 needs Gradle 8.12 or newer; the wrapper here is 8.14.3.
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Cardinal Components API and PlayerAbilityLib, pulled in by Apoli.
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    // Origins, Apoli and Calio are published through JitPack.
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://api.modrinth.com/maven' }
    mavenCentral()
}

loom {
    mixin { defaultRefmapName = 'windyorigins-refmap.json' }

    runs {
        // A second client, for trying the origins against another player.
        client2 {
            client()
            configName = "Minecraft Client 2"
            ideConfigGenerated = true
            runDir = "run2"
            programArgs "--username", "Player2"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Origins brings Apoli, Calio and their own libraries with it; no jars in libs/ are needed.
    modImplementation "com.github.apace100:origins-fabric:${project.origins_version}"
    modImplementation "com.github.apace100:apoli:${project.apoli_version}"
    modImplementation "com.github.apace100:calio:${project.calio_version}"
}

processResources {
    inputs.property 'version', project.version
    // mods.toml is what Forge and NeoForge read: there the mod runs through Sinytra Connector.
    filesMatching(['fabric.mod.json', 'META-INF/mods.toml']) {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
