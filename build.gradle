plugins {
    // Loom 1.11 needs Gradle 8.12 or newer; the wrapper here is 8.14.3.
    id 'fabric-loom' version '1.11-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

// Origins for this Minecraft version is not published to a Maven repository, so the released jar itself
// is used: it is downloaded once into libs/ and the libraries it carries inside (Apoli, Calio, Cardinal
// Components and the rest) are unpacked next to it. That is exactly the set of classes players run.
def libsDir = file('libs')
def originsJar = new File(libsDir, "origins-${project.minecraft_version}.jar")
if (!originsJar.exists()) {
    libsDir.mkdirs()
    def part = new File(libsDir, originsJar.name + '.part')
    new URL(project.origins_url).withInputStream { input -> part.withOutputStream { it << input } }
    def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(part.bytes).encodeHex().toString()
    if (sha1 != project.origins_sha1) {
        part.delete()
        throw new GradleException("Origins download does not match the expected checksum (got ${sha1})")
    }
    part.renameTo(originsJar)
}
def unpackNested
unpackNested = { File jar ->
    def nested = []
    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        zip.entries().findAll { it.name.startsWith('META-INF/jars/') && it.name.endsWith('.jar') }.each { entry ->
            def out = new File(libsDir, entry.name.substring(entry.name.lastIndexOf('/') + 1))
            if (!out.exists()) {
                out.withOutputStream { it << zip.getInputStream(entry) }
                nested << out
            }
        }
    }
    nested.each { unpackNested(it) }
}
unpackNested(originsJar)

loom {
    mixin { defaultRefmapName = 'windyorigins-refmap.json' }

    runs {
        // A second client, for trying the origins against another player.
        client2 {
            client()
            configName = "Minecraft Client 2"
            ideConfigGenerated = true
            runDir = "run2"
            programArgs "--username", "Player2"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Origins and everything unpacked from it, see above.
    modImplementation fileTree(dir: 'libs', include: '*.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
